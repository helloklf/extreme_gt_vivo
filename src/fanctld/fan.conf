# fan.conf —— fanctld 配置
#
# 温度单位 ℃，转速 0-100%。
# 每条曲线按温度从高到低写，两点之间线性插值；
# 高于第一点取第一点，低于最后一点取最后一点（最后一点给 0 就会自动停转）。
# 两路各算一个占空比，最终取两者的最大值。
# 顶盖温度通常比CPU/GPU核心温度低6~12℃

# SOC顶盖温度:风扇转速
pop=92:100 87:90 80:80 75:70 70:60 65:50 55:40 50:30 45:0

# 电池温度:风扇转速
batt=45:80 44:60 43:40 41:30 37:0

# 电池温度来源 main_batt_temp | bat_btb_temp
batt_src=/sys/class/cms_class/main_batt_temp
