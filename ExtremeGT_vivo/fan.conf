# fan.conf —— fanctld 配置
#
# 温度单位 ℃，转速 0-100%。
# 每条曲线按温度从高到低写，两点之间线性插值；
# 高于第一点取第一点，低于最后一点取最后一点（最后一点给 0 就会自动停转）。
# 两路各算一个占空比，最终取两者的最大值。

# SOC顶盖温度:风扇转速
pop=80:100 72:80 65:70 55:50 50:30 45:0

# 电池温度:风扇转速
batt=45:100 43:80 41:60 39:40 37:20 35:0

# 电池温度来源 main_batt_temp | bat_btb_temp
batt_src=/sys/class/cms_class/main_batt_temp
